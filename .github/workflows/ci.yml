name: CI
on: pull_request

jobs:
  test:
    # Self-hosted Mac Mini runner — has LOCAL_PG_URL and production env vars available.
    # STRIPE_WEBHOOK_SECRET is available on this runner; the stripe-checkout test
    # gracefully skips test 4 when the var is absent on other runners.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: API tests
        run: node scripts/test-suite-gate.js
        timeout-minutes: 3
      - name: Stripe checkout smoke test
        run: node tests/integration/stripe-checkout.test.js
        timeout-minutes: 2
      - name: Dashboard install
        working-directory: product/lead-response/dashboard
        run: npm ci
      - name: Dashboard tests
        working-directory: product/lead-response/dashboard
        run: |
          timeout 120 npx jest --passWithNoTests --forceExit --ci --testTimeout=10000 || STATUS=$?
          if [ "${STATUS:-0}" -eq 124 ]; then
            echo "Jest hung after tests completed — killed by timeout"
            exit 0
          fi
          exit ${STATUS:-0}
        timeout-minutes: 5
      - name: Dashboard build
        working-directory: product/lead-response/dashboard
        run: npm run build
