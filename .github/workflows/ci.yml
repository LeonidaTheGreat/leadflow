name: CI
on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: API tests
        run: npm test
      - name: Dashboard install
        working-directory: product/lead-response/dashboard
        run: npm ci
      - name: Dashboard build
        working-directory: product/lead-response/dashboard
        run: npm run build
      - name: Dashboard tests
        working-directory: product/lead-response/dashboard
        run: npx jest --passWithNoTests --forceExit --ci
