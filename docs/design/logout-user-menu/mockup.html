<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard User Menu Mockup</title>
  <style>
    :root {
      --bg: #f8fafc;
      --nav: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --hover: #f1f5f9;
      --danger: #dc2626;
      --ring: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top right, #dbeafe 0%, var(--bg) 40%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      color: var(--text);
    }
    .wrap { max-width: 1040px; margin: 48px auto; padding: 0 16px; }
    .nav {
      background: var(--nav);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
      position: relative;
    }
    .links { display: flex; gap: 8px; }
    .pill {
      border-radius: 8px;
      border: 1px solid transparent;
      padding: 8px 12px;
      font-size: 14px;
      color: var(--muted);
    }
    .pill.active { background: #dbeafe; color: #1d4ed8; }
    .user-trigger {
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      font-size: 14px;
    }
    .avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #1d4ed8;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 600;
    }
    .menu {
      position: absolute;
      right: 12px;
      top: 58px;
      width: 192px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      padding: 6px;
      box-shadow: 0 18px 38px rgba(15, 23, 42, 0.14);
    }
    .item {
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-size: 14px;
    }
    .item:hover { background: var(--hover); }
    .divider { height: 1px; background: var(--border); margin: 4px 2px; }
    .danger { color: var(--danger); }
    .focus-demo {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="nav">
      <div class="links">
        <div class="pill active">Lead Feed</div>
        <div class="pill">History</div>
        <div class="pill">Analytics</div>
        <div class="pill">Settings</div>
      </div>
      <button class="user-trigger focus-demo" aria-haspopup="menu" aria-expanded="true">
        <span class="avatar">AB</span>
        <span>Alex</span>
        <span aria-hidden="true">▾</span>
      </button>

      <div class="menu" role="menu" aria-label="User menu">
        <div class="item" role="menuitem">Profile</div>
        <div class="divider"></div>
        <div class="item danger" role="menuitem">Log out</div>
      </div>
    </section>
  </main>
</body>
</html>
